<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Logística CPL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --border-dark: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-dark);
        }

        .header-title h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .header-title p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-csv {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .nav-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .nav-tab {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .card {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border-dark);
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .quick-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .q-btn {
            background: #334155;
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .q-btn:active {
            background: var(--primary);
        }

        .time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .sig-container {
            border: 1px dashed var(--border-dark);
            border-radius: 8px;
            background: #0f172a;
            position: relative;
            margin-top: 6px;
        }

        canvas {
            width: 100%;
            height: 130px;
            touch-action: none;
            display: block;
            cursor: crosshair;
        }

        .sig-actions {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            background: #1e293b;
            border-top: 1px solid var(--border-dark);
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .btn-clear {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:active {
            background: var(--primary-dark);
        }

        .record-item {
            background: #0f172a;
            border: 1px solid var(--border-dark);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 6px;
            color: #60a5fa;
        }

        .record-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-action {
            background: #334155;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-delete {
            background: var(--danger);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Registro de Logística CPL</h1>
            <p>Controle Simplificado de Corridas</p>
        </div>
        <button class="btn-csv" onclick="exportarCSV()">📥 CSV</button>
    </header>

    <div class="nav-tabs">
        <div class="nav-tab active" id="tab-form" onclick="mudarAba('form')">+ Nova Corrida</div>
        <div class="nav-tab" id="tab-list" onclick="mudarAba('list')">Histórico (<span id="count-badge">0</span>)</div>
    </div>

    <!-- ABA FORMULÁRIO -->
    <div id="view-form" class="view-section active">
        <form id="log-form" onsubmit="salvarRegistro(event)">
            
            <div class="card">
                <div class="card-title">1. Dados da Coleta & Carga</div>
                
                <div class="form-group">
                    <label>A. Data *</label>
                    <input type="date" id="data" required>
                </div>

                <div class="form-group">
                    <label>B. Tipo de Carga *</label>
                    <input type="text" id="tipoCarga" placeholder="Ex: Medicamento, Instrumental..." required>
                    <div class="quick-btns">
                        <button type="button" class="q-btn" onclick="setCampo('tipoCarga', 'Medicamento')">Medicamento</button>
                        <button type="button" class="q-btn" onclick="setCampo('tipoCarga', 'Instrumental')">Instrumental</button>
                        <button type="button" class="q-btn" onclick="setCampo('tipoCarga', 'Rouparia')">Rouparia</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>C. Nº de Volumes *</label>
                    <input type="number" id="volumes" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label>D. Origem *</label>
                    <input type="text" id="origem" placeholder="Ex: CME, CAF, Lavanderia..." required>
                    <div class="quick-btns">
                        <button type="button" class="q-btn" onclick="setCampo('origem', 'CME')">CME</button>
                        <button type="button" class="q-btn" onclick="setCampo('origem', 'CAF')">CAF</button>
                        <button type="button" class="q-btn" onclick="setCampo('origem', 'Lavanderia')">Lavanderia</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">2. Tempos de Transporte</div>
                <div class="time-grid">
                    <div class="form-group">
                        <label>Coleta *</label>
                        <input type="time" id="horaColeta" required>
                    </div>
                    <div class="form-group">
                        <label>Entrega *</label>
                        <input type="time" id="horaEntrega" required>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">3. Assinaturas</div>
                
                <div class="form-group">
                    <label>Motorista</label>
                    <input type="text" id="nomeMotorista" placeholder="Nome do Motorista">
                    <div class="sig-container">
                        <canvas id="sigMotorista"></canvas>
                        <div class="sig-actions">
                            <span style="font-size:0.75rem; color:var(--text-muted);">Assine acima</span>
                            <button type="button" class="btn-clear" onclick="limparAssinatura('sigMotorista')">Limpar</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Recebedor</label>
                    <input type="text" id="nomeRecebedor" placeholder="Nome do Recebedor">
                    <div class="sig-container">
                        <canvas id="sigRecebedor"></canvas>
                        <div class="sig-actions">
                            <span style="font-size:0.75rem; color:var(--text-muted);">Assine acima</span>
                            <button type="button" class="btn-clear" onclick="limparAssinatura('sigRecebedor')">Limpar</button>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">Salvar Registro</button>
        </form>
    </div>

    <!-- ABA HISTÓRICO -->
    <div id="view-list" class="view-section">
        <div id="registros-container">
            <p style="text-align:center; color:var(--text-muted); padding: 20px;">Nenhum registro salvo ainda.</p>
        </div>
    </div>

    <script>
        // Inicialização de Datas e Horas padrão
        document.getElementById('data').valueAsDate = new Date();
        const agora = new Date().toTimeString().slice(0,5);
        document.getElementById('horaColeta').value = agora;

        function setCampo(id, valor) {
            document.getElementById(id).value = valor;
        }

        function mudarAba(aba) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            
            if(aba === 'form') {
                document.getElementById('tab-form').classList.add('active');
                document.getElementById('view-form').classList.add('active');
            } else {
                document.getElementById('tab-list').classList.add('active');
                document.getElementById('view-list').classList.add('active');
                carregarRegistros();
            }
        }

        // Configuração dos Canvases de Assinatura
        const canvases = ['sigMotorista', 'sigRecebedor'];
        const sigData = {};

        canvases.forEach(id => {
            const canvas = document.getElementById(id);
            const ctx = canvas.getContext('2d');
            let desenhando = false;

            function ajustarCanvas() {
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                ctx.strokeStyle = '#f8fafc';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
            }
            setTimeout(ajustarCanvas, 200);

            canvas.addEventListener('mousedown', iniciarDesenho);
            canvas.addEventListener('mousemove', desenhar);
            canvas.addEventListener('mouseup', pararDesenho);
            canvas.addEventListener('mouseleave', pararDesenho);

            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); iniciarDesenho(e.touches[0]); });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); desenhar(e.touches[0]); });
            canvas.addEventListener('touchend', (e) => { e.preventDefault(); pararDesenho(); });

            function obterPosicao(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX || e.pageX) - rect.left,
                    y: (e.clientY || e.pageY) - rect.top
                };
            }

            function iniciarDesenho(e) {
                desenhando = true;
                const pos = obterPosicao(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }

            function desenhar(e) {
                if (!desenhando) return;
                const pos = obterPosicao(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }

            function pararDesenho() {
                if (desenhando) {
                    desenhando = false;
                    sigData[id] = canvas.toDataURL();
                }
            }
        });

        function limparAssinatura(id) {
            const canvas = document.getElementById(id);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            delete sigData[id];
        }

        function salvarRegistro(e) {
            e.preventDefault();

            const registro = {
                id: Date.now(),
                data: document.getElementById('data').value,
                tipoCarga: document.getElementById('tipoCarga').value,
                volumes: document.getElementById('volumes').value,
                origem: document.getElementById('origem').value,
                horaColeta: document.getElementById('horaColeta').value,
                horaEntrega: document.getElementById('horaEntrega').value,
                motorista: document.getElementById('nomeMotorista').value || 'Não informado',
                recebedor: document.getElementById('nomeRecebedor').value || 'Não informado',
                sigMot: sigData['sigMotorista'] || '',
                sigRec: sigData['sigRecebedor'] || ''
            };

            let registros = JSON.parse(localStorage.getItem('cpl_registros') || '[]');
            registros.unshift(registro);
            localStorage.setItem('cpl_registros', JSON.stringify(registros));

            alert('Registro salvo com sucesso!');
            document.getElementById('log-form').reset();
            document.getElementById('data').valueAsDate = new Date();
            canvases.forEach(id => limparAssinatura(id));
            mudarAba('list');
        }

        function carregarRegistros() {
            const container = document.getElementById('registros-container');
            const registros = JSON.parse(localStorage.getItem('cpl_registros') || '[]');
            document.getElementById('count-badge').innerText = registros.length;

            if (registros.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding: 20px;">Nenhum registro salvo ainda.</p>';
                return;
            }

            container.innerHTML = registros.map(r => `
                <div class="record-item">
                    <div class="record-header">
                        <span>${r.data} - ${r.tipoCarga} (${r.volumes} vol)</span>
                        <span>${r.horaColeta} ➔ ${r.horaEntrega}</span>
                    </div>
                    <div><strong>Origem:</strong> ${r.origem}</div>
                    <div><strong>Motorista:</strong> ${r.motorista}</div>
                    <div><strong>Recebedor:</strong> ${r.recebedor}</div>
                    <div class="record-actions">
                        <button class="btn-action" onclick="gerarPDF(${r.id})">📄 PDF</button>
                        <button class="btn-action btn-delete" onclick="excluirRegistro(${r.id})">🗑️ Excluir</button>
                    </div>
                </div>
            `).join('');
        }

        function excluirRegistro(id) {
            if (confirm('Deseja realmente excluir este registro?')) {
                let registros = JSON.parse(localStorage.getItem('cpl_registros') || '[]');
                registros = registros.filter(r => r.id !== id);
                localStorage.setItem('cpl_registros', JSON.stringify(registros));
                carregarRegistros();
            }
        }

        function gerarPDF(id) {
            const registros = JSON.parse(localStorage.getItem('cpl_registros') || '[]');
            const r = registros.find(item => item.id === id);
            if (!r) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(16);
            doc.text("Comprovante de Logística - CPL Xpress", 14, 20);

            doc.setFontSize(11);
            doc.text(`Data: ${r.data}`, 14, 32);
            doc.text(`Tipo de Carga: ${r.tipoCarga}`, 14, 40);
            doc.text(`Volumes: ${r.volumes}`, 14, 48);
            doc.text(`Origem: ${r.origem}`, 14, 56);
            doc.text(`Horário Coleta: ${r.horaColeta} | Entrega: ${r.horaEntrega}`, 14, 64);
            doc.text(`Motorista: ${r.motorista}`, 14, 72);
            doc.text(`Recebedor: ${r.recebedor}`, 14, 80);

            if(r.sigMot) {
                doc.text("Assinatura Motorista:", 14, 95);
                doc.addImage(r.sigMot, 'PNG', 14, 100, 60, 25);
            }

            if(r.sigRec) {
                doc.text("Assinatura Recebedor:", 110, 95);
                doc.addImage(r.sigRec, 'PNG', 110, 100, 60, 25);
            }

            doc.save(`logistica_${r.data}_${r.id}.pdf`);
        }

        function exportarCSV() {
            const registros = JSON.parse(localStorage.getItem('cpl_registros') || '[]');
            if (registros.length === 0) {
                alert('Não há registros para exportar.');
                return;
            }

            let csv = 'Data,TipoCarga,Volumes,Origem,Coleta,Entrega,Motorista,Recebedor\n';
            registros.forEach(r => {
                csv += `"${r.data}","${r.tipoCarga}","${r.volumes}","${r.origem}","${r.horaColeta}","${r.horaEntrega}","${r.motorista}","${r.recebedor}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8ome do Motorista">
                    <div class="sig-container">
                        <canvas id="sigMotorista"></canvas>
                        <div class="sig-actions">
                            <span style="font-size:0.75rem; color:var(--text-muted);">Assine acima</span>
                            <button type="button" class="btn-clear" onclick="limparAssinatura('sigMotorista')">Limpar</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Recebedor</label>
                    <input type="text" id="nomeRecebedor" placeholder="Nome do Recebedor">
                    <div class="sig-container">
                        <canvas id="sigRecebedor"></canvas>
                        <div class="sig-actions">
                            <span style="font-size:0.75rem; color:var(--text-muted);">Assine acima</span>
                            <button type="button" class="btn-clear" onclick="limparAssinatura('sigRecebedor')">Limpar</button>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">Salvar Registro</button>
        </form>
    </div>

    <!-- ABA HISTÓRICO -->
    <div id="view-list" class="view-section">
        <div id="registros-container">
            <p style="text-align:center; color:var(--text-muted); padding: 20px;">Nenhum registro salvo ainda.</p>
        </div>
    </div>

        function excluirRegistro(id) {
            if (confirm('Deseja realmente excluir este registro?')) {
                let registros = JSON.parse(localStorage.getItem('cpl_registros') || '[]');
                registros = registros.filter(r => r.id !== id);
                localStorage.setItem('cpl_registros', JSON.stringify(registros));
                carregarRegistros();
            }
        }

        function gerarPDF(id) {
            const registros = JSON.parse(localStorage.getItem('cpl_registros') || '[]');
            const r = registros.find(item => item.id === id);
            if (!r) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(16);
            doc.text("Comprovante de Logística - CPL Xpress", 14, 20);

            doc.setFontSize(11);
            doc.text(`Data: ${r.data}`, 14, 32);
            doc.text(`Tipo de Carga: ${r.tipoCarga}`, 14, 40);
            doc.text(`Volumes: ${r.volumes}`, 14, 48);
            doc.text(`Origem: ${r.origem}`, 14, 56);
            doc.text(`Horário Coleta: ${r.horaColeta} | Entrega: ${r.horaEntrega}`, 14, 64);
            doc.text(`Motorista: ${r.motorista}`, 14, 72);
            doc.text(`Recebedor: ${r.recebedor}`, 14, 80);

            if(r.sigMot) {
                doc.text("Assinatura Motorista:", 14, 95);
                doc.addImage(r.sigMot, 'PNG', 14, 100, 60, 25);
            }

            if(r.sigRec) {
                doc.text("Assinatura Recebedor:", 110, 95);
                doc.addImage(r.sigRec, 'PNG', 110, 100, 60, 25);
            }

            doc.save(`logistica_${r.data}_${r.id}.pdf`);
        }
